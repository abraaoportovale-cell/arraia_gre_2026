<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arraiá do GRE 2026 — Vote no seu pratinho!</title>
<link href="https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {--yellow:#F5B800;--orange:#E8580C;--red:#C0392B;--brown:#5C3317;--chalk:#2B2B2B;--cream:#FFF8E7;--green:#2E7D32;--wood:#8B5E3C;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--chalk);min-height:100vh;font-family:'Nunito',sans-serif;color:var(--cream);overflow-x:hidden}
  .bunting{position:fixed;top:0;left:0;right:0;height:80px;z-index:100;pointer-events:none;overflow:hidden}
  .bunting svg{width:100%;height:80px}
  @keyframes glow{0%,100%{opacity:1;filter:drop-shadow(0 0 6px #fffaaa)}50%{opacity:.6;filter:drop-shadow(0 0 2px #fffaaa)}}
  .bulb{animation:glow 1.8s ease-in-out infinite}
  .loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:'Passion One',sans-serif;font-size:1.4rem;color:var(--yellow);letter-spacing:.1em}
  .loading-overlay.visible{display:flex}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{width:44px;height:44px;border:4px solid rgba(245,184,0,.25);border-top-color:var(--yellow);border-radius:50%;animation:spin .8s linear infinite}
  .page{max-width:720px;margin:0 auto;padding:90px 16px 80px}
  .hero{text-align:center;padding:28px 0 16px}
  .hero .edition{font-family:'Passion One',sans-serif;font-size:1.05rem;letter-spacing:.2em;color:var(--yellow);text-transform:uppercase;margin-bottom:4px}
  .hero h1{font-family:'Passion One',sans-serif;font-size:clamp(3.2rem,10vw,5.5rem);font-weight:900;line-height:.92;color:var(--yellow);text-shadow:4px 4px 0 var(--orange),6px 6px 0 var(--brown);letter-spacing:.03em;text-transform:uppercase}
  .hero h1 span{display:block;font-size:clamp(2rem,7vw,3.8rem);color:#fff;text-shadow:3px 3px 0 var(--brown)}
  .hero .subtitle{margin-top:10px;font-size:.9rem;letter-spacing:.15em;color:#ffd97a;text-transform:uppercase;font-weight:700}
  .date-badge{display:inline-block;background:var(--wood);border:3px solid var(--yellow);border-radius:6px;padding:8px 24px;margin:12px auto 0;font-family:'Passion One',sans-serif;font-size:1.4rem;letter-spacing:.12em;color:var(--yellow);text-shadow:2px 2px 0 rgba(0,0,0,.5);box-shadow:0 4px 0 rgba(0,0,0,.4)}
  .intro-box{background:rgba(255,248,231,.07);border:1px solid rgba(245,184,0,.25);border-radius:12px;padding:18px 22px;margin:20px 0 24px;font-size:.95rem;line-height:1.6;color:#fef9ef;text-align:center}
  .intro-box strong{color:var(--yellow)}
  #login-screen{text-align:center;padding:32px 20px 40px;background:rgba(0,0,0,.3);border-radius:16px;border:1px solid rgba(245,184,0,.15)}
  #login-screen p{color:#ffd97a;font-size:1rem;margin-bottom:8px}
  #login-screen small{display:block;color:rgba(255,255,255,.3);font-size:.75rem;margin-top:12px}
  .google-btn{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#3c4043;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;padding:14px 28px;border:2px solid #dadce0;border-radius:40px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);transition:box-shadow .15s,transform .1s;margin-top:10px}
  .google-btn:hover{box-shadow:0 4px 18px rgba(0,0,0,.45);transform:translateY(-2px)}
  .google-btn svg{width:22px;height:22px;flex-shrink:0}
  #user-bar{display:none;background:rgba(0,0,0,.4);border:1px solid rgba(245,184,0,.2);border-radius:10px;padding:10px 16px;margin-bottom:18px;align-items:center;gap:10px}
  #user-bar img{width:38px;height:38px;border-radius:50%;border:2px solid var(--yellow);object-fit:cover}
  #user-bar .uname{font-weight:700;color:var(--yellow);flex:1;font-size:.95rem}
  #user-bar .uemail{color:rgba(255,255,255,.4);font-size:.75rem;display:block}
  .logout-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#ccc;font-family:'Nunito',sans-serif;font-size:.8rem;padding:5px 14px;border-radius:20px;cursor:pointer}
  form{display:flex;flex-direction:column;gap:22px}
  .section{background:rgba(0,0,0,.35);border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
  .section-header{display:flex;align-items:center;gap:10px;padding:13px 20px;font-family:'Passion One',sans-serif;font-size:1.2rem;letter-spacing:.08em;text-transform:uppercase}
  .sec-doces .section-header{background:linear-gradient(135deg,#7B3F00,#C0392B)}
  .sec-salgados .section-header{background:linear-gradient(135deg,#4A1942,#8B3E7C)}
  .sec-milho .section-header{background:linear-gradient(135deg,#5C4300,#D4AC0D);color:#1a1a1a}
  .sec-caldos .section-header{background:linear-gradient(135deg,#1A3A00,#2E7D32)}
  .sec-petiscos .section-header{background:linear-gradient(135deg,#3E1F00,#8B5E3C)}
  .sec-bebidas .section-header{background:linear-gradient(135deg,#003060,#1565C0)}
  .sec-outros .section-header{background:linear-gradient(135deg,#2C2C2C,#555)}
  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px;padding:10px}
  .item-label{display:flex;flex-direction:column;gap:5px;padding:10px 13px;border-radius:8px;cursor:pointer;transition:background .15s,transform .1s;user-select:none;background:rgba(255,255,255,.04)}
  .item-label:hover{background:rgba(245,184,0,.1);transform:translateY(-1px)}
  .item-label input[type="checkbox"]{display:none}
  .item-top{display:flex;align-items:center;gap:8px}
  .checkmark{width:21px;height:21px;border:2px solid rgba(255,255,255,.3);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:rgba(0,0,0,.3)}
  .checkmark svg{opacity:0;transform:scale(.5);transition:all .15s}
  .item-label:has(input:checked) .checkmark{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 8px rgba(245,184,0,.5)}
  .item-label:has(input:checked) .checkmark svg{opacity:1;transform:scale(1)}
  .item-label:has(input:checked){background:rgba(245,184,0,.15)}
  .item-text{font-size:.87rem;font-weight:700;line-height:1.3;flex:1}
  .voters-list{display:flex;flex-wrap:wrap;gap:4px;padding-left:29px}
  .voter-chip{font-size:.68rem;background:rgba(245,184,0,.18);border:1px solid rgba(245,184,0,.3);color:#ffd97a;padding:2px 8px;border-radius:10px;white-space:nowrap;font-weight:700}
  .submit-wrap{text-align:center;padding-top:4px}
  .btn-submit{display:inline-flex;align-items:center;gap:10px;background:var(--yellow);color:var(--brown);font-family:'Passion One',sans-serif;font-size:1.35rem;letter-spacing:.1em;padding:15px 46px;border:none;border-radius:40px;cursor:pointer;box-shadow:0 6px 0 #b88500;transition:transform .1s,box-shadow .1s;text-transform:uppercase}
  .btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 0 #b88500}
  .btn-submit:active{transform:translateY(2px);box-shadow:0 2px 0 #b88500}
  .btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}
  #success-msg{display:none;text-align:center;padding:40px 20px;background:rgba(46,125,50,.15);border:2px solid rgba(46,125,50,.4);border-radius:16px}
  @keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
  #success-msg.show{display:block;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
  #success-msg .emoji-big{font-size:4rem;display:block;margin-bottom:10px}
  #success-msg h2{font-family:'Passion One',sans-serif;font-size:2rem;color:var(--yellow);margin-bottom:8px}
  #success-msg p{color:#ccc;font-size:.92rem;line-height:1.5}
  .btn-edit{display:inline-block;margin-top:18px;background:rgba(245,184,0,.12);border:1px solid var(--yellow);color:var(--yellow);font-family:'Passion One',sans-serif;font-size:1rem;padding:10px 28px;border-radius:30px;cursor:pointer;letter-spacing:.08em}
